<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ivory:    '#FBF9F5',
          cream:    '#F4EEE3',
          beige:    '#EAE0CE',
          sand:     '#E3D5BC',
          gold:     '#C2A35E',
          goldDeep: '#A8854A',
          goldSoft: '#D9C28E',
          ink:      '#2C2823',
          muted:    '#8A8073',
          line:     '#ECE5D8',
        },
        fontFamily: {
          mincho:  ['"Shippori Mincho"', 'serif'],

<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: #FBF9F5;
    font-family: "Zen Kaku Gothic New", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .no-sb::-webkit-scrollbar { display: none; }
  .no-sb { -ms-overflow-style: none; scrollbar-width: none; }
  .snap-x-mandatory { scroll-snap-type: x mandatory; }
  .snap-start { scroll-snap-align: start; }
  .ph-stripes {
    background-image: repeating-linear-gradient(
      -45deg, #EFE7D6 0 12px, #E6DAC2 12px 24px
    );
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .anim-fade { animation: fadeIn .25s ease; }
  .anim-pop { animation: popIn .3s cubic-bezier(.22,.8,.3,1); }
  @keyframes dotPulse { 0%,60%,100% { opacity:.25; transform: translateY(0); } 30% { opacity:1; transform: translateY(-3px); } }
  .anim-dot { animation: dotPulse 1s ease-in-out infinite; }
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.is-visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
